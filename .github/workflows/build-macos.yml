name: Build macOS app

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash build-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: D-Writing-Pad-macOS
          path: dist/D-Writing-Pad.dmg
          if-no-files-found: error
